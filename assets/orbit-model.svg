<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" width="880" height="320" role="img" aria-label="ORBIT Security Model. Score = Coverage × Maturity × Validation. Coverage: are the right assets and risks in scope. Maturity: how well is it operated. Validation: is it proven to work. Illustrative example: an additive average of 0.90, 0.80 and 0.20 gives 0.63, while ORBIT's product gives 0.14, exposing the validation gap.">
  <defs>
    <pattern id="og" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1A1A26" stroke-width="1"/>
    </pattern>
    <linearGradient id="ob" x1="0" x2="1">
      <stop offset="0%" stop-color="#5E3F96"/>
      <stop offset="100%" stop-color="#A268F8"/>
    </linearGradient>
    <linearGradient id="warn" x1="0" x2="1">
      <stop offset="0%" stop-color="#8A3B5C"/>
      <stop offset="100%" stop-color="#F06292"/>
    </linearGradient>
    <clipPath id="of"><rect x="1" y="1" width="878" height="438" rx="16"/></clipPath>
    <style>
      .m{font-family:Consolas,'JetBrains Mono','Fira Code',Menlo,monospace}
      .bar{fill:#5E5E78;font-size:11px}
      .kick{fill:#8B8BA3;font-size:10.5px;letter-spacing:2px}
      .ttl{fill:#FFFFFF;font-size:21px;font-weight:800;letter-spacing:2.5px}
      .eq{fill:#E6E6F0;font-size:15px}
      .a{fill:#A268F8}
      .L{fill:#A268F8;font-size:30px;font-weight:800}
      .N{fill:#FFFFFF;font-size:13px;font-weight:700;letter-spacing:2px}
      .Q{fill:#E6E6F0;font-size:12.5px}
      .D{fill:#8B8BA3;font-size:10.5px}
      .S{fill:#5E5E78;font-size:10px;letter-spacing:1px}
      .V{fill:#FFFFFF;font-size:12px;font-weight:700}
      .lab{fill:#8B8BA3;font-size:11px;letter-spacing:1.5px;font-weight:700}
      .f{fill:#C9C9D6;font-size:12px}
      .big{font-size:18px;font-weight:800}
      .cap{fill:#9A9AB2;font-size:11px}
      .g1{animation:gr 1.6s .2s ease-out both}.g2{animation:gr 1.6s .4s ease-out both}.g3{animation:gr 1.6s .6s ease-out both}
      .g4{animation:gr 1.8s 1s ease-out both}.g5{animation:gr 1.8s 1.4s ease-out both}
      @keyframes gr{from{transform:scaleX(0)}to{transform:scaleX(1)}}
      .alert{animation:al 1.6s ease-in-out infinite}
      @keyframes al{50%{opacity:.35}}
      .spin{animation:sp 14s linear infinite;transform-origin:56px 82px}
      @keyframes sp{to{transform:rotate(360deg)}}
    </style>
  </defs>

    <g clip-path="url(#of)">
    <rect width="880" height="320" fill="#0E0E14"/>
    <rect width="880" height="320" fill="url(#og)"/>
  </g>
  <rect x="1" y="1" width="878" height="320" rx="16" fill="none" stroke="#2A2A3A" stroke-width="1.5"/>
  <path d="M1,32 V17 Q1,1 17,1 H863 Q879,1 879,17 V32 Z" fill="#14141D"/>
  <line x1="1" y1="32" x2="879" y2="32" stroke="#2A2A3A"/>
  <circle cx="22" cy="17" r="5" fill="#3A3A4E"/><circle cx="40" cy="17" r="5" fill="#3A3A4E"/><circle cx="58" cy="17" r="5" fill="#A268F8"/>
  <text x="440" y="21" text-anchor="middle" class="m bar">orbit://security-model — how security is actually scored</text>

  <g class="m">
    <text x="30" y="70" class="kick">73 PURPLE PLANET - @arlindo0x73</text>
    <text x="30" y="100" class="ttl"><tspan class="a">HOW ORBIT SCORES SECURITY?</tspan></text>
  </g>
  <line x1="30" y1="118" x2="850" y2="118" stroke="#2A2A3A"/>

  <!-- factor cards -->
  <g class="m">
    <!-- C -->
    <rect x="30" y="134" width="260" height="138" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.2"/>
    <text x="48" y="174" class="L">COVERAGE</text>
    <text x="48" y="200" class="Q">Are the right assets in scope?</text>
    <text x="48" y="218" class="D">critical assets · IT · cloud · OT/ICS</text>
    <rect x="48" y="234" width="224" height="7" rx="3.5" fill="#22222F"/>
    <rect x="48" y="234" width="202" height="7" rx="3.5" fill="url(#ob)" class="g1" style="transform-origin:48px 237px"/>
    <text x="48" y="260" class="S">EXAMPLE</text>
    <text x="272" y="260" text-anchor="end" class="V">0.90</text>

    <text x="300" y="210" text-anchor="middle" class="a" font-size="18" font-weight="700">×</text>

    <!-- M -->
    <rect x="310" y="134" width="260" height="138" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.2"/>
    <text x="328" y="174" class="L">MATURITY</text>
    <text x="328" y="200" class="Q">How well is it operated?</text>
    <text x="328" y="218" class="D">process · ownership · repeatability</text>
    <rect x="328" y="234" width="224" height="7" rx="3.5" fill="#22222F"/>
    <rect x="328" y="234" width="179" height="7" rx="3.5" fill="url(#ob)" class="g2" style="transform-origin:328px 237px"/>
    <text x="328" y="260" class="S">EXAMPLE</text>
    <text x="552" y="260" text-anchor="end" class="V">0.80</text>

    <text x="580" y="210" text-anchor="middle" class="a" font-size="18" font-weight="700">×</text>

    <!-- V -->
    <rect x="590" y="134" width="260" height="138" rx="10" fill="#14141D" stroke="#F06292" stroke-opacity=".55" stroke-width="1.2"/>
    <text x="608" y="174" class="L">VALIDATION</text>
    <text x="608" y="200" class="Q">Is it proven to work?</text>
    <text x="608" y="218" class="D">testing · telemetry · evidence</text>
    <rect x="608" y="234" width="224" height="7" rx="3.5" fill="#22222F"/>
    <rect x="608" y="234" width="45" height="7" rx="3.5" fill="url(#warn)" class="g3" style="transform-origin:608px 237px"/>
    <text x="608" y="260" class="S">EXAMPLE</text>
    <text x="832" y="260" text-anchor="end" class="V" style="fill:#F06292">0.20 ⚠</text>
  </g>
</svg>
