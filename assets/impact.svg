<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 150" width="880" height="150" role="img" aria-label="8+ years in cyber risk; $270M industrial M&amp;A; 80% enterprise risk reduction; 400+ people brought into cybersecurity; 6 media and academic interviews">
  <defs>
    <pattern id="g3" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1C1C28" stroke-width="1"/>
    </pattern>
    <linearGradient id="num" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C9A6FF"/>
    </linearGradient>
    <style>
      .m{font-family:Consolas,'JetBrains Mono','Fira Code',Menlo,monospace}
      .v{font-size:34px;font-weight:700;fill:url(#num)}
      .l{font-size:10.5px;fill:#8B8BA3;letter-spacing:1.2px}
      .k{animation:u .8s ease-out both}
      .k1{animation-delay:.05s}.k2{animation-delay:.2s}.k3{animation-delay:.35s}.k4{animation-delay:.5s}.k5{animation-delay:.65s}
      @keyframes u{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      .scan{animation:s 6s linear infinite}
      @keyframes s{from{transform:translateX(-120px)}to{transform:translateX(900px)}}
    </style>
    <linearGradient id="sweep" x1="0" x2="1">
      <stop offset="0%" stop-color="#A268F8" stop-opacity="0"/>
      <stop offset="50%" stop-color="#A268F8" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#A268F8" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="frame"><rect x="1" y="1" width="878" height="148" rx="14"/></clipPath>
  </defs>

  <rect x="1" y="1" width="878" height="148" rx="14" fill="#0E0E14" stroke="#2A2A3A" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="148" rx="14" fill="url(#g3)" opacity=".6"/>
  <g clip-path="url(#frame)"><rect class="scan" x="0" y="146" width="120" height="3" fill="url(#sweep)"/></g>

  <g stroke="#2A2A3A">
    <line x1="176" y1="30" x2="176" y2="120"/><line x1="352" y1="30" x2="352" y2="120"/>
    <line x1="528" y1="30" x2="528" y2="120"/><line x1="704" y1="30" x2="704" y2="120"/>
  </g>

  <g class="m" text-anchor="middle">
    <g class="k k1"><text x="88" y="74" class="v">8+</text><text x="88" y="100" class="l">YEARS IN</text><text x="88" y="115" class="l">CYBER RISK</text></g>
    <g class="k k2"><text x="264" y="74" class="v">$270M</text><text x="264" y="100" class="l">INDUSTRIAL M&amp;A</text><text x="264" y="115" class="l">TRANSFORMATION</text></g>
    <g class="k k3"><text x="440" y="74" class="v">80%</text><text x="440" y="100" class="l">ENTERPRISE RISK</text><text x="440" y="115" class="l">REDUCTION</text></g>
    <g class="k k4"><text x="616" y="74" class="v">400+</text><text x="616" y="100" class="l">PEOPLE BROUGHT</text><text x="616" y="115" class="l">INTO CYBERSECURITY</text></g>
    <g class="k k5"><text x="792" y="74" class="v">6</text><text x="792" y="100" class="l">MEDIA &amp; ACADEMIC</text><text x="792" y="115" class="l">INTERVIEWS</text></g>
  </g>
</svg>
