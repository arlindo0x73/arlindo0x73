<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 290" width="880" height="290" role="img" aria-label="ORBIT decision flow: business context, critical assets and impact, threat and exposure, risk treatment priorities, measurable outcomes, continuous improvement">
  <defs>
    <pattern id="g2" width="22" height="22" patternUnits="userSpaceOnUse">
      <path d="M22 0H0V22" fill="none" stroke="#1C1C28" stroke-width="1"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#A268F8"/>
    </marker>
    <style>
      .m{font-family:Consolas,'JetBrains Mono','Fira Code',Menlo,monospace}
      .n{fill:#5E5E78;font-size:11px;letter-spacing:1px}
      .t{fill:#FFFFFF;font-size:12px;font-weight:700;letter-spacing:.5px}
      .s{fill:#8B8BA3;font-size:10px}
      .h{fill:#FFFFFF;font-size:16px;font-weight:700;letter-spacing:3px}
      .c{fill:#8B8BA3;font-size:11px;letter-spacing:1px}
      .flow{stroke-dasharray:4 6;animation:f 1.2s linear infinite}
      @keyframes f{to{stroke-dashoffset:-20}}
      .card{animation:in .6s ease-out both}
      .d1{animation-delay:.1s}.d2{animation-delay:.3s}.d3{animation-delay:.5s}.d4{animation-delay:.7s}.d5{animation-delay:.9s}
      @keyframes in{from{opacity:0}to{opacity:1}}
      .glow{animation:gl 5s ease-in-out infinite}
      @keyframes gl{0%,100%{stroke:#2E2442}50%{stroke:#A268F8}}
    </style>
  </defs>

  <rect x="1" y="1" width="878" height="288" rx="14" fill="#0E0E14" stroke="#2A2A3A" stroke-width="1.5"/>
  <rect x="1" y="1" width="878" height="288" rx="14" fill="url(#g2)" opacity=".6"/>

  <text x="30" y="44" class="m h">ORBIT <tspan fill="#A268F8">·</tspan> DECISION FLOW</text>
  <text x="850" y="44" text-anchor="end" class="m c">cyber complexity → actionable business decisions</text>
  <line x1="30" y1="60" x2="850" y2="60" stroke="#2A2A3A"/>

  <!-- connectors -->
  <g stroke="#A268F8" stroke-width="1.5" fill="none">
    <path d="M178,140 H198" class="flow" marker-end="url(#ah)"/>
    <path d="M346,140 H366" class="flow" marker-end="url(#ah)"/>
    <path d="M514,140 H534" class="flow" marker-end="url(#ah)"/>
    <path d="M682,140 H702" class="flow" marker-end="url(#ah)"/>
  </g>

  <!-- nodes -->
  <g class="m">
    <g class="card d1">
      <rect x="30" y="88" width="148" height="104" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.5" class="glow"/>
      <text x="44" y="110" class="n">01</text>
      <text x="44" y="138" class="t">BUSINESS</text>
      <text x="44" y="154" class="t">CONTEXT</text>
      <text x="44" y="178" class="s">objectives · ops</text>
    </g>
    <g class="card d2">
      <rect x="198" y="88" width="148" height="104" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.5" class="glow" style="animation-delay:1s"/>
      <text x="212" y="110" class="n">02</text>
      <text x="212" y="138" class="t">CRITICAL ASSETS</text>
      <text x="212" y="154" class="t">&amp; IMPACT</text>
      <text x="212" y="178" class="s">dependencies</text>
    </g>
    <g class="card d3">
      <rect x="366" y="88" width="148" height="104" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.5" class="glow" style="animation-delay:2s"/>
      <text x="380" y="110" class="n">03</text>
      <text x="380" y="138" class="t">THREAT &amp;</text>
      <text x="380" y="154" class="t">EXPOSURE</text>
      <text x="380" y="178" class="s">threats · vulns</text>
    </g>
    <g class="card d4">
      <rect x="534" y="88" width="148" height="104" rx="10" fill="#14141D" stroke="#2E2442" stroke-width="1.5" class="glow" style="animation-delay:3s"/>
      <text x="548" y="110" class="n">04</text>
      <text x="548" y="138" class="t">RISK TREATMENT</text>
      <text x="548" y="154" class="t">PRIORITIES</text>
      <text x="548" y="178" class="s">priority · resources</text>
    </g>
    <g class="card d5">
      <rect x="702" y="88" width="148" height="104" rx="10" fill="#14141D" stroke="#A268F8" stroke-width="1.5"/>
      <text x="716" y="110" class="n" fill="#A268F8">05</text>
      <text x="716" y="138" class="t">MEASURABLE</text>
      <text x="716" y="154" class="t">OUTCOMES</text>
      <text x="716" y="178" class="s">metrics · ownership</text>
    </g>
  </g>

  <!-- continuous improvement loop -->
  <path d="M776,192 V222 Q776,240 758,240 H122 Q104,240 104,222 V196" fill="none" stroke="#A268F8" stroke-width="1.5" class="flow" marker-end="url(#ah)"/>
  <rect x="340" y="230" width="200" height="20" rx="10" fill="#0E0E14"/>
  <text x="440" y="244" text-anchor="middle" class="m c" fill="#C9A6FF">↻ CONTINUOUS IMPROVEMENT</text>

  <text x="440" y="274" text-anchor="middle" class="m s">maturity measured by outcomes and risk reduction — not by controls counted or tools deployed</text>
</svg>
